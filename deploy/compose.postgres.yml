# nbuddyn next to an n8n that uses Postgres.
# 1. Create the read-only user with the SQL in the README.
# 2. Put this service in the same network as n8n's Postgres (and Redis, if any).
# 3. docker compose -f compose.postgres.yml up -d, then open http://localhost:8787
services:
  nbuddyn:
    image: ghcr.io/diegoparras/nbuddyn:latest
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      NBUDDYN_DATABASE_URL: postgres://nbuddyn:choose-a-password@postgres:5432/n8n
      NBUDDYN_PASSWORD: choose-a-login-password
      # 32 characters or more. Keep it: it opens the secrets nbuddyn stores.
      NBUDDYN_SECRET_KEY: change-me-to-something-long-and-random-1234
      # Optional: the queue, the workers and the webhook processors.
      # NBUDDYN_REDIS_URL: redis://:password@redis:6379
    volumes:
      - nbuddyn_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

volumes:
  nbuddyn_data:
