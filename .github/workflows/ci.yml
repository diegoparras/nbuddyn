name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # "Run workflow" on main with a version publishes it: the image under that
  # version, and a release with its notes from the changelog.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, as in Cargo.toml (for example 0.17.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # nbuddyn reads n8n's own database, which n8n may change between versions.
  # This starts each supported n8n for real, lets it build its database, and
  # has nbuddyn read it.
  compat:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        n8n: ["1.123.100", "2.48.7", "3.3.0"]
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: n8n
          POSTGRES_DB: n8n
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U n8n" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Start n8n ${{ matrix.n8n }} on ${{ matrix.database }}
        run: |
          mkdir -p n8ndata && chmod 777 n8ndata
          if [ "${{ matrix.database }}" = sqlite ]; then
            docker run -d --name n8n -p 5678:5678 \
              -v "$PWD/n8ndata:/home/node/.n8n" "n8nio/n8n:${{ matrix.n8n }}"
          else
            docker run -d --name n8n --network host \
              -e DB_TYPE=postgresdb -e DB_POSTGRESDB_HOST=localhost \
              -e DB_POSTGRESDB_USER=n8n -e DB_POSTGRESDB_PASSWORD=n8n \
              -e DB_POSTGRESDB_DATABASE=n8n "n8nio/n8n:${{ matrix.n8n }}"
          fi
          for attempt in $(seq 1 60); do
            # Readiness, not liveness: n8n answers /healthz before it has
            # finished building its database.
            if curl -fs http://localhost:5678/healthz/readiness > /dev/null; then echo "n8n is ready"; exit 0; fi
            sleep 3
          done
          docker logs n8n | tail -40
          exit 1
      - name: nbuddyn reads it
        run: |
          if [ "${{ matrix.database }}" = sqlite ]; then
            sudo chmod -R a+rX n8ndata
            export NBUDDYN_DATABASE_URL="sqlite:$PWD/n8ndata/database.sqlite"
          else
            export NBUDDYN_DATABASE_URL="postgres://n8n:n8n@localhost:5432/n8n"
          fi
          ./target/debug/nbuddyn check

  # One image per architecture, each built on a machine of that architecture,
  # so nothing is emulated.
  build:
    if: github.event_name != 'pull_request'
    needs: [test, compat]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # What went into the image and how it was built travel with it.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Keep the digest for the next job
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins both images under the tags people pull: `latest` for main, and the
  # version for a `v1.2.3` tag.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # `contents: write` creates the release for a version tag; `id-token`
      # lets the image be signed as this workflow, with no stored key.
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Image name in lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` follows main, whatever the repository's default branch is.
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.release }},enable=${{ inputs.release != '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Publish the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}" --format '{{ json .Manifest }}' | jq -r .digest)
          cosign sign --yes "$IMAGE@$digest"
      - uses: actions/checkout@v4
        if: inputs.release != '' && github.ref == 'refs/heads/main'
      - name: Create the release from the changelog
        if: inputs.release != '' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release }}
        run: |
          # The version asked for has to be the one the code says it is.
          grep -qx "version = \"$VERSION\"" Cargo.toml || { echo "Cargo.toml is not at $VERSION"; exit 1; }
          # The section of the changelog for this version, without its heading.
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n\nImage: `%s:%s`, for linux/amd64 and linux/arm64, signed with cosign.\n' "$IMAGE" "$VERSION" >> notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "nbuddyn $VERSION" --notes-file notes.md
