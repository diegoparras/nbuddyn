[package]
name = "nbuddyn"
version = "0.15.0"
edition = "2021"
description = "A tiny, read-only cockpit for self-hosted n8n: radar, alarms and governance."
license = "MIT"
repository = "https://github.com/diegoparras/nbuddyn"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
base64 = "0.22"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-postgres-rustls = "0.14.0"
webpki-roots = "1.0.12"
rustls-pemfile = "2.2.0"
ring = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
