<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>nbuddyn</title>
<style>
  :root {
    --bg: #0B0F14; --panel: #121820; --line: #223041; --ink: #E6EDF3; --soft: #C5D0DC; --muted: #8B9BB0;
    --red: #FF6B4A; --red-ink: #FF8E73; --red-bg: #2A1410;
    --amber: #F5B83D; --amber-bg: #2A2110;
    --green: #3DD68C; --green-bg: #10231A;
    --blue-ink: #9DB8E0;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 1120px; margin: 0 auto; padding: 0 28px 44px; }
  .mono { font-family: var(--mono); }
  .label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; }
  header .label { flex: 1 1 160px; }
  .langs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; }
  button { font: 600 12px var(--mono); cursor: pointer; min-height: 40px; border-radius: 2px; }
  .langs button { background: none; border: 0; color: var(--muted); padding: 0 12px; }
  .langs button[aria-pressed="true"] { background: var(--amber); color: var(--bg); }
  .export { background: none; border: 1px solid var(--amber); color: var(--amber); padding: 0 16px; border-radius: 4px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .notice { margin-top: 20px; border: 1px solid var(--red); background: var(--red-bg); border-radius: 4px; padding: 14px 18px; overflow-wrap: anywhere; }
  .notice .why { color: var(--soft); font-family: var(--mono); font-size: 13px; margin-top: 4px; }

  .hero { display: flex; flex-wrap: wrap; gap: 28px 44px; padding: 36px 0 30px; align-items: center; }
  .dial { flex: 0 1 300px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dial svg { width: 280px; max-width: 100%; height: auto; }
  .score { font-family: var(--mono); font-size: 64px; font-weight: 600; line-height: 1; }
  .score small { font-size: 20px; color: var(--muted); font-weight: 500; }
  .zone { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px; }
  .risk { color: var(--red-ink); } .caution { color: var(--amber); } .ok { color: var(--green); } .off { color: var(--muted); }
  .brief { flex: 1 1 420px; min-width: 0; }
  h1 { margin: 10px 0 12px; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin: 0 0 18px; color: var(--soft); max-width: 600px; }
  .lights { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; max-width: 640px; }
  .light { border: 1px solid var(--line); border-radius: 4px; padding: 10px 6px; text-align: center; font-family: var(--mono); }
  .light .name { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; overflow-wrap: anywhere; }
  .light .count { font-size: 24px; font-weight: 600; }
  .light.high { background: var(--red-bg); border-color: var(--red); color: var(--red-ink); }
  .light.medium { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
  .light.ok { background: var(--green-bg); border-color: var(--green); color: var(--green); }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .totals > div { padding: 14px 0; }
  .totals + .totals { border-top: 0; }
  .totals .n small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .totals .n { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .totals .t { font-size: 13px; color: var(--muted); }

  h2 { display: flex; align-items: center; gap: 10px; margin: 32px 0 4px; font: 600 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
  h2 i { width: 10px; height: 10px; flex: 0 0 10px; }
  h2.high { color: var(--red-ink); } h2.high i { background: var(--red); border-radius: 50%; }
  h2.medium { color: var(--amber); } h2.medium i { background: var(--amber); }
  h2.low { color: var(--blue-ink); } h2.low i { border: 2px solid var(--blue-ink); }
  h2.info { color: var(--muted); } h2.info i { height: 2px; background: var(--muted); }

  .group { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .group .num { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--muted); flex: 0 0 44px; }
  .group .what { flex: 1 1 420px; min-width: 0; }
  h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .group p { margin: 0; color: var(--soft); }
  .where { flex: 0 1 300px; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .where div { padding: 1px 0; }
  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; font-size: 11px; }
  summary { cursor: pointer; color: var(--amber); padding: 6px 0; min-height: 32px; }
  h2.plain { color: var(--ink); flex-wrap: wrap; margin-top: 44px; }
  .ranges { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; margin-left: auto; }
  .ranges button { background: none; border: 0; color: var(--muted); padding: 0 12px; min-height: 32px; letter-spacing: 0; text-transform: none; }
  .ranges button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
  #history .totals { margin-top: 12px; }
  #history.loading figure, #history.loading table { opacity: 0.5; }
  figure { margin: 26px 0 0; position: relative; }
  figcaption { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 400; color: var(--soft); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .chart { display: block; width: 100%; }
  .chart text { font: 11px var(--mono); fill: var(--muted); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .end { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .tip { position: absolute; z-index: 2; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font-size: 13px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
  .tip .when { color: var(--muted); font-family: var(--mono); font-size: 12px; margin-bottom: 2px; }
  .tip b { font-weight: 600; margin-right: 6px; }
  .tip .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .tip span { color: var(--soft); }
  table { width: 100%; border-collapse: collapse; margin-top: 22px; font-size: 14px; }
  th { text-align: left; font: 500 12px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  th.num, td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; padding-right: 0; padding-left: 12px; }
  td.num { white-space: nowrap; }
  td.bad { color: var(--red-ink); }
  .daytable { margin-top: 10px; font-size: 13px; }
  .daytable table { margin-top: 4px; max-width: 520px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .morerows { background: none; border: 0; color: var(--amber); padding: 6px 0; margin-top: 4px; }
  @media (max-width: 560px) {
    .optional { display: none; }
    th { font-size: 11px; letter-spacing: 0; vertical-align: bottom; }
    th.num, td.num { padding-left: 8px; }
  }
  footer { margin-top: 26px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }

  @media print {
    :root { --bg: #fff; --panel: #fff; --line: #c9ced6; --ink: #111827; --soft: #374151; --muted: #4b5563;
            --red: #b4271a; --red-ink: #b4271a; --red-bg: #fff; --amber: #8a5300; --amber-bg: #fff;
            --green: #17663f; --green-bg: #fff; --blue-ink: #1d3faa; }
    .langs, .export, .ranges, .tip, .morerows { display: none; }
    tr[hidden] { display: table-row; }
    figure { break-inside: avoid; }
    details[data-more] > summary { display: none; }
    .group { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#F5B83D" stroke-width="1.5"/><path d="M5 17h8M21 17h8M17 5v4M17 25v4" stroke="#F5B83D" stroke-width="1.5" stroke-linecap="round"/><circle cx="17" cy="17" r="3" fill="#F5B83D"/></svg>
      nbuddyn
    </div>
    <span class="label" id="tagline"></span>
    <div class="langs" role="group" id="langs">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <button type="button" class="export" id="export"></button>
  </header>

  <div id="notice"></div>

  <section class="hero">
    <div class="dial">
      <svg viewBox="0 0 260 150" role="img" id="gauge">
        <path d="M30 130 A100 100 0 0 1 160.9 34.9" fill="none" stroke="var(--red)" stroke-width="10"/>
        <path d="M160.9 34.9 A100 100 0 0 1 219.1 84.6" fill="none" stroke="var(--amber)" stroke-width="10"/>
        <path d="M219.1 84.6 A100 100 0 0 1 230 130" fill="none" stroke="var(--green)" stroke-width="10"/>
        <path d="M22 130H14M53.6 53.6L48 48M130 22V14M206.4 53.6L212 48M238 130H246" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
        <line id="needle" x1="130" y1="130" x2="46" y2="130" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="130" cy="130" r="8" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
      </svg>
      <div class="score off" id="score">–<small>/100</small></div>
      <div class="zone off" id="zone"></div>
    </div>
    <div class="brief">
      <div class="label" id="sweep"></div>
      <h1 id="headline"></h1>
      <p class="lead" id="lead"></p>
      <div class="lights" id="lights"></div>
    </div>
  </section>

  <div class="totals" id="totals"></div>
  <div class="totals" id="cluster" hidden></div>
  <div id="groups"></div>
  <section id="history" hidden>
    <h2 class="plain"><span id="historyTitle"></span><div class="ranges" role="group" id="ranges"></div></h2>
    <div id="historyNotice"></div>
    <div class="totals" id="historyTotals"></div>
    <figure>
      <figcaption><span id="runsTitle"></span><span class="legend" id="runsLegend"></span></figcaption>
      <svg class="chart" id="runsChart" role="img"></svg>
    </figure>
    <figure>
      <figcaption><span id="scoreTitle"></span></figcaption>
      <svg class="chart" id="scoreChart" role="img"></svg>
    </figure>
    <details class="daytable"><summary id="dayTableTitle"></summary><div id="dayTable"></div></details>
    <div id="workflowTable"></div>
    <div class="note" id="historyNote"></div>
  </section>
  <footer id="footer"></footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var stored = null;
  try { stored = localStorage.getItem("nbuddyn.lang"); } catch (e) {}
  var lang = stored || (navigator.language || "en").slice(0, 2);
  if (["en", "es", "pt"].indexOf(lang) < 0) lang = "en";

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function itemLine(item, ui) {
    var line = el("div", null, [item.workflow, item.node, item.detail].filter(Boolean).join(" › "));
    if (item.active === false) line.appendChild(el("span", "tag", ui.inactive));
    return line;
  }

  function setNeedle(score, available) {
    var shown = available ? Math.max(0, Math.min(100, score)) : 0;
    var angle = Math.PI * (1 - shown / 100);
    $("needle").setAttribute("x2", (130 + 84 * Math.cos(angle)).toFixed(1));
    $("needle").setAttribute("y2", (130 - 84 * Math.sin(angle)).toFixed(1));
  }

  function render(r) {
    var ui = r.ui;
    document.documentElement.lang = r.lang;
    $("tagline").textContent = ui.tagline;
    $("export").textContent = ui.export;
    $("langs").setAttribute("aria-label", ui.language);
    Array.prototype.forEach.call($("langs").children, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === r.lang));
    });
    $("footer").textContent = ui.read_only;

    var notice = $("notice");
    notice.replaceChildren();
    if (!r.available || r.error) {
      var box = el("div", "notice");
      box.appendChild(el("div", null, ui.unavailable));
      if (r.error) box.appendChild(el("div", "why", r.error));
      notice.appendChild(box);
    }
    if (r.cluster_error) {
      var redisBox = el("div", "notice");
      redisBox.appendChild(el("div", null, ui.cluster_unavailable));
      redisBox.appendChild(el("div", "why", r.cluster_error));
      notice.appendChild(redisBox);
    }

    var zoneClass = r.available ? r.zone : "off";
    var score = $("score");
    score.className = "score " + zoneClass;
    score.replaceChildren(document.createTextNode(r.available ? r.score : "–"), el("small", null, "/100"));
    var zone = $("zone");
    zone.className = "zone " + zoneClass;
    zone.textContent = r.available ? ui["zone_" + r.zone] : "";
    setNeedle(r.score, r.available);
    $("gauge").setAttribute("aria-label", ui.gauge + ": " + (r.available ? r.score + "/100, " + ui["zone_" + r.zone] : "–"));

    $("sweep").textContent = r.generated_at
      ? ui.sweep + " · " + new Date(r.generated_at * 1000).toLocaleString(r.lang)
      : "";
    $("headline").textContent = r.available ? r.headline : ui.unavailable;
    $("lead").textContent = r.available ? r.lead : "";

    var lights = $("lights");
    lights.replaceChildren();
    if (r.available) {
      r.lights.forEach(function (l) {
        var light = el("div", "light " + l.level);
        light.appendChild(el("div", "name", ui["light_" + l.key]));
        light.appendChild(el("div", "count", l.count === 0 ? ui.ok : l.count));
        lights.appendChild(light);
      });
    }

    var totals = $("totals");
    totals.replaceChildren();
    if (r.available) {
      [[r.totals.urgent, ui.total_urgent, "risk"], [r.totals.important, ui.total_important, "caution"],
       [r.totals.minor, ui.total_minor, ""], [r.inventory.workflows, ui.workflows_reviewed, ""],
       [r.inventory.nodes, ui.nodes_reviewed, ""]].forEach(function (t) {
        var cell = el("div");
        cell.appendChild(el("div", "n " + (t[0] > 0 ? t[2] : ""), t[0]));
        cell.appendChild(el("div", "t", t[1]));
        totals.appendChild(cell);
      });
    }

    var cluster = $("cluster");
    cluster.replaceChildren();
    var cells = [];
    if (r.available && r.cluster) {
      var c = r.cluster;
      var memory = c.redis_max_mb > 0 ? c.redis_used_mb + " / " + c.redis_max_mb + " MB" : c.redis_used_mb + " MB";
      cells.push(
        [c.waiting, ui.queue_waiting, c.waiting >= 100 ? "caution" : ""],
        [c.active, ui.queue_active, ""],
        [c.workers, ui.workers, c.main + c.workers + c.webhooks > 0 && c.workers === 0 ? "risk" : ""],
        [c.webhooks, ui.webhooks, ""]);
    }
    if (r.available && r.runners) {
      cells.push([r.runners.alive + " / " + r.runners.total, ui.runners, r.runners.alive < r.runners.total ? "risk" : ""]);
    }
    if (r.available && r.cluster) {
      cells.push([memory, ui.redis_memory + (r.cluster.redis_max_mb > 0 ? "" : " · " + ui.no_limit), ""]);
    }
    cluster.hidden = cells.length === 0;
    cells.forEach(function (t) {
      var cell = el("div");
      cell.appendChild(el("div", "n " + t[2], t[0]));
      cell.appendChild(el("div", "t", t[1]));
      cluster.appendChild(cell);
    });

    var out = $("groups");
    out.replaceChildren();
    var n = 0;
    [["high", ui.urgent], ["medium", ui.important], ["low", ui.minor], ["info", ui.info]].forEach(function (sev) {
      var groups = r.groups.filter(function (g) { return g.severity === sev[0]; });
      if (groups.length === 0) return;
      var heading = el("h2", sev[0]);
      heading.appendChild(el("i"));
      heading.appendChild(document.createTextNode(sev[1]));
      out.appendChild(heading);

      groups.forEach(function (g) {
        n += 1;
        var row = el("div", "group");
        row.appendChild(el("span", "num", n < 10 ? "0" + n : n));
        var what = el("div", "what");
        what.appendChild(el("h3", null, g.title));
        what.appendChild(el("p", null, g.advice));
        row.appendChild(what);

        var where = el("div", "where");
        var first = sev[0] === "info" ? 0 : 3;
        g.items.slice(0, first).forEach(function (item) { where.appendChild(itemLine(item, ui)); });
        var rest = g.items.slice(first);
        if (rest.length > 0) {
          var more = el("details");
          more.setAttribute("data-more", "");
          more.appendChild(el("summary", null, first > 0 ? "+ " + rest.length + " " + ui.more : ui.show + " (" + rest.length + ")"));
          rest.forEach(function (item) { more.appendChild(itemLine(item, ui)); });
          where.appendChild(more);
        }
        row.appendChild(where);
        out.appendChild(row);
      });
    });
  }

  var SVG = "http://www.w3.org/2000/svg";
  var SERIES = { ok: "#4A8FE8", failed: "#E85D3F", canceled: "#6B7A8C" };
  var RANGES = [7, 30, 90];
  var range = 30;
  try { range = Number(localStorage.getItem("nbuddyn.range")) || 30; } catch (e) {}
  if (RANGES.indexOf(range) < 0) range = 30;
  var lastUi = null;
  var lastHistory = null;

  function svg(tag, attrs, text) {
    var node = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (text !== undefined) node.textContent = String(text);
    return node;
  }

  function compact(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
    if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
    return n.toLocaleString(lang);
  }

  function dayLabel(day, long) {
    var date = new Date(day + "T00:00:00");
    return date.toLocaleDateString(lang, long ? { weekday: "short", day: "numeric", month: "short", year: "numeric" } : { day: "numeric", month: "short" });
  }

  /* A round number at or above the largest value, so the axis reads cleanly. */
  function niceTop(value) {
    if (value <= 4) return 4;
    var unit = Math.pow(10, Math.floor(Math.log10(value)));
    var steps = [1, 2, 4, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * unit >= value) return steps[i] * unit;
    return 10 * unit;
  }

  function percent(part, whole) {
    if (!whole) return "–";
    var p = 100 * part / whole;
    return (p > 0 && p < 1 ? "<1" : Math.round(p)) + "%";
  }

  /* A column with a rounded top and a square foot on the baseline. */
  function columnPath(x, y, w, h, round) {
    var r = round ? Math.min(4, w / 2, h) : 0;
    return "M" + x + " " + (y + h) + "V" + (y + r) + "a" + r + " " + r + " 0 0 1 " + r + " " + -r +
      "H" + (x + w - r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r + "V" + (y + h) + "Z";
  }

  /* Shared frame: gridlines, y ticks, three x labels, and one hover band per day. */
  function frame(chart, days, top, ticks, height, right, tipRows) {
    var width = Math.max(280, Math.floor(chart.getBoundingClientRect().width));
    var m = { l: 40, r: right, t: 10, b: 24 };
    var plotW = width - m.l - m.r, plotH = height - m.t - m.b;
    var band = plotW / days.length;
    chart.replaceChildren();
    chart.setAttribute("viewBox", "0 0 " + width + " " + height);
    chart.setAttribute("height", height);
    var y = function (v) { return m.t + plotH - plotH * v / top; };
    ticks.forEach(function (t) {
      chart.appendChild(svg("line", { "class": "grid", x1: m.l, x2: m.l + plotW, y1: y(t) + 0.5, y2: y(t) + 0.5 }));
      chart.appendChild(svg("text", { x: m.l - 8, y: y(t) + 4, "text-anchor": "end" }, compact(t)));
    });
    var marks = days.length > 2 ? [0, Math.floor((days.length - 1) / 2), days.length - 1] : days.map(function (_, i) { return i; });
    marks.forEach(function (i, k) {
      var anchor = k === 0 ? "start" : (k === marks.length - 1 ? "end" : "middle");
      var x = k === 0 ? m.l : (k === marks.length - 1 ? m.l + plotW : m.l + band * (i + 0.5));
      chart.appendChild(svg("text", { x: x, y: height - 6, "text-anchor": anchor }, dayLabel(days[i].day)));
    });
    chart.appendChild(svg("rect", { x: m.l, y: m.t, width: plotW, height: plotH, fill: "transparent" }));
    var glow = svg("rect", { y: m.t, height: plotH, width: Math.max(1, band), fill: "var(--ink)", opacity: 0, "pointer-events": "none" });
    chart.appendChild(glow);
    var geometry = { m: m, plotW: plotW, plotH: plotH, band: band, y: y, x: function (i) { return m.l + band * i; } };
    var figure = chart.parentNode;
    var tip = figure.querySelector(".tip") || figure.appendChild(el("div", "tip"));
    tip.hidden = true;
    var hide = function () { tip.hidden = true; glow.setAttribute("opacity", 0); };
    chart.onpointerleave = hide;
    chart.onpointermove = function (ev) {
      var box = chart.getBoundingClientRect();
      var i = Math.floor((ev.clientX - box.left - m.l) / band);
      if (i < 0 || i >= days.length) return hide();
      glow.setAttribute("x", geometry.x(i));
      glow.setAttribute("opacity", 0.06);
      tip.replaceChildren(el("div", "when", dayLabel(days[i].day, true)));
      tipRows(days[i]).forEach(function (row) {
        var line = el("div");
        var key = el("i", "key");
        key.style.background = row[0];
        line.appendChild(key);
        line.appendChild(el("b", null, row[1]));
        line.appendChild(el("span", null, row[2]));
        tip.appendChild(line);
      });
      tip.hidden = false;
      var left = ev.clientX - box.left + 14;
      if (left + tip.offsetWidth > box.width) left = ev.clientX - box.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = (chart.offsetTop + m.t) + "px";
    };
    return geometry;
  }

  function drawRuns(h, ui) {
    var chart = $("runsChart");
    var peak = Math.max.apply(null, h.days.map(function (d) { return (d.ok || 0) + (d.failed || 0) + (d.canceled || 0); }));
    var top = niceTop(peak);
    var g = frame(chart, h.days, top, [0, top / 2, top], 200, 34, function (d) {
      var rows = [[SERIES.ok, (d.ok || 0).toLocaleString(lang), ui.runs_ok], [SERIES.failed, (d.failed || 0).toLocaleString(lang), ui.runs_failed]];
      if (d.canceled) rows.push([SERIES.canceled, d.canceled.toLocaleString(lang), ui.runs_canceled]);
      return rows;
    });
    var w = Math.max(1, Math.min(24, g.band - 2));
    var gap = w >= 4 ? 2 : 0;
    h.days.forEach(function (d, i) {
      var x = g.x(i) + (g.band - w) / 2;
      var parts = [["ok", d.ok || 0], ["failed", d.failed || 0], ["canceled", d.canceled || 0]].filter(function (p) { return p[1] > 0; });
      var base = g.m.t + g.plotH;
      parts.forEach(function (p, k) {
        var height = Math.max(1, g.plotH * p[1] / top - (k > 0 ? gap : 0));
        base -= height + (k > 0 ? gap : 0);
        chart.appendChild(svg("path", { d: columnPath(x, base, w, height, k === parts.length - 1), fill: SERIES[p[0]], "pointer-events": "none" }));
      });
    });
    chart.setAttribute("aria-label", ui.runs_title + ": " + (h.totals.ok || 0) + " " + ui.runs_ok + ", " + (h.totals.failed || 0) + " " + ui.runs_failed);

    var legend = $("runsLegend");
    legend.replaceChildren();
    [["ok", ui.runs_ok], ["failed", ui.runs_failed]].concat(h.totals.canceled ? [["canceled", ui.runs_canceled]] : []).forEach(function (s) {
      var item = el("span");
      var swatch = el("i");
      swatch.style.background = SERIES[s[0]];
      item.appendChild(swatch);
      item.appendChild(document.createTextNode(s[1]));
      legend.appendChild(item);
    });
  }

  function drawScore(h, ui) {
    var chart = $("scoreChart");
    var g = frame(chart, h.days, 100, [0, 50, 100], 140, 34, function (d) {
      return [[SERIES.ok, d.score === undefined ? "–" : d.score, ui.col_score.toLowerCase()]];
    });
    var path = "", pen = false, last = null;
    h.days.forEach(function (d, i) {
      if (d.score === undefined) { pen = false; return; }
      var x = g.x(i) + g.band / 2, y = g.y(d.score);
      path += (pen ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      pen = true;
      last = { x: x, y: y, score: d.score };
    });
    if (path) chart.appendChild(svg("path", { d: path, fill: "none", stroke: SERIES.ok, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "pointer-events": "none" }));
    if (last) {
      chart.appendChild(svg("circle", { cx: last.x, cy: last.y, r: 4, fill: SERIES.ok, stroke: "var(--bg)", "stroke-width": 2, "pointer-events": "none" }));
      chart.appendChild(svg("text", { "class": "end", x: last.x + 9, y: last.y + 4 }, last.score));
    }
    chart.setAttribute("aria-label", ui.score_title + (last ? ": " + last.score + "/100" : ""));
  }

  function table(headers, rows) {
    var t = el("table");
    var head = t.appendChild(el("thead")).appendChild(el("tr"));
    headers.forEach(function (hd) { head.appendChild(el("th", hd[1], hd[0])); });
    var body = t.appendChild(el("tbody"));
    rows.forEach(function (cells) {
      var tr = body.appendChild(el("tr"));
      cells.forEach(function (c, i) { tr.appendChild(el("td", (headers[i][1] + " " + (c[1] || "")).trim(), c[0])); });
    });
    return t;
  }

  function renderHistory() {
    var h = lastHistory, ui = lastUi;
    var section = $("history");
    section.hidden = !(h && ui && h.enabled);
    if (section.hidden) return;
    section.classList.remove("loading");
    $("historyTitle").textContent = ui.history;
    $("runsTitle").textContent = ui.runs_title;
    $("scoreTitle").textContent = ui.score_title;
    $("dayTableTitle").textContent = ui.table_by_day;

    var ranges = $("ranges");
    ranges.setAttribute("aria-label", ui.history);
    ranges.replaceChildren();
    RANGES.forEach(function (n) {
      var b = el("button", null, n + " " + ui.days);
      b.type = "button";
      b.setAttribute("data-range", n);
      b.setAttribute("aria-pressed", String(n === range));
      ranges.appendChild(b);
    });

    var notice = $("historyNotice");
    notice.replaceChildren();
    if (h.error) {
      var box = el("div", "notice");
      box.appendChild(el("div", null, ui.history_unavailable));
      box.appendChild(el("div", "why", h.error));
      notice.appendChild(box);
    }

    var total = (h.totals.ok || 0) + (h.totals.failed || 0) + (h.totals.canceled || 0);
    var totals = $("historyTotals");
    totals.replaceChildren();
    [[compact(total), ui.runs_total, ""], [compact(h.totals.ok || 0), ui.runs_ok, ""],
     [compact(h.totals.failed || 0), ui.runs_failed, h.totals.failed ? "risk" : ""],
     [percent(h.totals.failed || 0, total), ui.failure_rate, ""]].forEach(function (t) {
      var cell = el("div");
      cell.appendChild(el("div", "n " + t[2], t[0]));
      cell.appendChild(el("div", "t", t[1]));
      totals.appendChild(cell);
    });

    if (h.days.length) { drawRuns(h, ui); drawScore(h, ui); }

    $("dayTable").replaceChildren(table(
      [[ui.col_day, ""], [ui.runs_ok, "num"], [ui.runs_failed, "num"], [ui.col_score, "num"]],
      h.days.slice().reverse().map(function (d) {
        return [[dayLabel(d.day, true)], [(d.ok || 0).toLocaleString(lang)], [(d.failed || 0).toLocaleString(lang), d.failed ? "bad" : ""], [d.score === undefined ? "–" : d.score]];
      })));

    var holder = $("workflowTable");
    holder.replaceChildren();
    if (h.workflows.length === 0) {
      holder.appendChild(el("p", "note", ui.history_empty));
    } else {
      var t = table(
        [[ui.col_workflow, ""], [ui.col_runs, "num"], [ui.col_failed, "num"], [ui.col_rate, "num"], [ui.col_last, "num optional"]],
        h.workflows.map(function (w) {
          var runs = (w.ok || 0) + (w.failed || 0) + (w.canceled || 0);
          return [[w.name], [runs.toLocaleString(lang)], [(w.failed || 0).toLocaleString(lang), w.failed ? "bad" : ""], [percent(w.failed || 0, runs)], [dayLabel(w.last_day)]];
        }));
      holder.appendChild(t);
      var rows = t.querySelectorAll("tbody tr");
      if (rows.length > 10) {
        for (var i = 10; i < rows.length; i++) rows[i].hidden = true;
        var more = el("button", "morerows", "+ " + (rows.length - 10) + " " + ui.more);
        more.type = "button";
        more.addEventListener("click", function () {
          Array.prototype.forEach.call(rows, function (r) { r.hidden = false; });
          more.remove();
        });
        holder.appendChild(more);
      }
    }
    $("historyNote").textContent = (h.since ? ui.history_since + " " + dayLabel(h.since, true) + ". " : "") + ui.history_note;
  }

  function loadHistory() {
    $("history").classList.add("loading");
    fetch("api/history?days=" + range, { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
      .then(function (h) { lastHistory = h; renderHistory(); })
      .catch(function (err) { console.error("nbuddyn", err); });
  }

  function load() {
    fetch("api/report?lang=" + encodeURIComponent(lang), { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
      .then(function (r) { lastUi = r.ui; render(r); renderHistory(); })
      .catch(function (err) { console.error("nbuddyn", err); });
    loadHistory();
  }

  $("ranges").addEventListener("click", function (ev) {
    var next = Number(ev.target.getAttribute && ev.target.getAttribute("data-range"));
    if (!next || next === range) return;
    range = next;
    try { localStorage.setItem("nbuddyn.range", String(range)); } catch (e) {}
    Array.prototype.forEach.call($("ranges").children, function (b) {
      b.setAttribute("aria-pressed", String(Number(b.getAttribute("data-range")) === range));
    });
    loadHistory();
  });
  var resizing = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizing);
    resizing = setTimeout(renderHistory, 150);
  });

  $("langs").addEventListener("click", function (ev) {
    var next = ev.target.getAttribute && ev.target.getAttribute("data-lang");
    if (!next) return;
    lang = next;
    try { localStorage.setItem("nbuddyn.lang", lang); } catch (e) {}
    load();
  });
  $("export").addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; });
    window.print();
  });

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
