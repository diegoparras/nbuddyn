<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>nbuddyn</title>
<style>
  :root {
    --bg: #0B0F14; --panel: #121820; --line: #223041; --ink: #E6EDF3; --soft: #C5D0DC; --muted: #8B9BB0;
    --red: #FF6B4A; --red-ink: #FF8E73; --red-bg: #2A1410;
    --amber: #F5B83D; --amber-bg: #2A2110;
    --green: #3DD68C; --green-bg: #10231A;
    --blue-ink: #9DB8E0;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 1120px; margin: 0 auto; padding: 0 28px 44px; }
  .mono { font-family: var(--mono); }
  .label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 22px 0; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; }
  header .label { flex: 1 1 160px; }
  .langs { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; }
  button { font: 600 12px var(--mono); cursor: pointer; min-height: 40px; border-radius: 2px; }
  .langs button { background: none; border: 0; color: var(--muted); padding: 0 12px; }
  .langs button[aria-pressed="true"] { background: var(--amber); color: var(--bg); }
  .export { background: none; border: 1px solid var(--amber); color: var(--amber); padding: 0 16px; border-radius: 4px; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .notice { margin-top: 20px; border: 1px solid var(--red); background: var(--red-bg); border-radius: 4px; padding: 14px 18px; overflow-wrap: anywhere; }
  .notice .why { color: var(--soft); font-family: var(--mono); font-size: 13px; margin-top: 4px; }

  .hero { display: flex; flex-wrap: wrap; gap: 28px 44px; padding: 36px 0 30px; align-items: center; }
  .dial { flex: 0 1 300px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .dial svg { width: 280px; max-width: 100%; height: auto; }
  .score { font-family: var(--mono); font-size: 64px; font-weight: 600; line-height: 1; }
  .score small { font-size: 20px; color: var(--muted); font-weight: 500; }
  .zone { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px; }
  .risk { color: var(--red-ink); } .caution { color: var(--amber); } .ok { color: var(--green); } .off { color: var(--muted); }
  .brief { flex: 1 1 420px; min-width: 0; }
  h1 { margin: 10px 0 12px; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin: 0 0 18px; color: var(--soft); max-width: 600px; }
  .lights { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; max-width: 640px; }
  .light { border: 1px solid var(--line); border-radius: 4px; padding: 10px 6px; text-align: center; font-family: var(--mono); }
  .light .name { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; overflow-wrap: anywhere; }
  .light .count { font-size: 24px; font-weight: 600; }
  .light.high { background: var(--red-bg); border-color: var(--red); color: var(--red-ink); }
  .light.medium { background: var(--amber-bg); border-color: var(--amber); color: var(--amber); }
  .light.ok { background: var(--green-bg); border-color: var(--green); color: var(--green); }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .totals > div { padding: 14px 0; }
  .totals + .totals { border-top: 0; }
  .totals .n small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .totals .n { font-family: var(--mono); font-size: 24px; font-weight: 500; }
  .totals .t { font-size: 13px; color: var(--muted); }

  h2 { display: flex; align-items: center; gap: 10px; margin: 32px 0 4px; font: 600 13px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; }
  h2 i { width: 10px; height: 10px; flex: 0 0 10px; }
  h2.high { color: var(--red-ink); } h2.high i { background: var(--red); border-radius: 50%; }
  h2.medium { color: var(--amber); } h2.medium i { background: var(--amber); }
  h2.low { color: var(--blue-ink); } h2.low i { border: 2px solid var(--blue-ink); }
  h2.info { color: var(--muted); } h2.info i { height: 2px; background: var(--muted); }

  .group { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .group .num { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--muted); flex: 0 0 44px; }
  .group .what { flex: 1 1 420px; min-width: 0; }
  h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  .group p { margin: 0; color: var(--soft); }
  .where { flex: 0 1 300px; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .where div { padding: 1px 0; }
  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; font-size: 11px; }
  summary { cursor: pointer; color: var(--amber); padding: 6px 0; min-height: 32px; }
  footer { margin-top: 26px; font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }

  @media print {
    :root { --bg: #fff; --panel: #fff; --line: #c9ced6; --ink: #111827; --soft: #374151; --muted: #4b5563;
            --red: #b4271a; --red-ink: #b4271a; --red-bg: #fff; --amber: #8a5300; --amber-bg: #fff;
            --green: #17663f; --green-bg: #fff; --blue-ink: #1d3faa; }
    .langs, .export { display: none; }
    details[data-more] > summary { display: none; }
    .group { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="#F5B83D" stroke-width="1.5"/><path d="M5 17h8M21 17h8M17 5v4M17 25v4" stroke="#F5B83D" stroke-width="1.5" stroke-linecap="round"/><circle cx="17" cy="17" r="3" fill="#F5B83D"/></svg>
      nbuddyn
    </div>
    <span class="label" id="tagline"></span>
    <div class="langs" role="group" id="langs">
      <button type="button" data-lang="es">ES</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <button type="button" class="export" id="export"></button>
  </header>

  <div id="notice"></div>

  <section class="hero">
    <div class="dial">
      <svg viewBox="0 0 260 150" role="img" id="gauge">
        <path d="M30 130 A100 100 0 0 1 160.9 34.9" fill="none" stroke="var(--red)" stroke-width="10"/>
        <path d="M160.9 34.9 A100 100 0 0 1 219.1 84.6" fill="none" stroke="var(--amber)" stroke-width="10"/>
        <path d="M219.1 84.6 A100 100 0 0 1 230 130" fill="none" stroke="var(--green)" stroke-width="10"/>
        <path d="M22 130H14M53.6 53.6L48 48M130 22V14M206.4 53.6L212 48M238 130H246" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
        <line id="needle" x1="130" y1="130" x2="46" y2="130" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="130" cy="130" r="8" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
      </svg>
      <div class="score off" id="score">–<small>/100</small></div>
      <div class="zone off" id="zone"></div>
    </div>
    <div class="brief">
      <div class="label" id="sweep"></div>
      <h1 id="headline"></h1>
      <p class="lead" id="lead"></p>
      <div class="lights" id="lights"></div>
    </div>
  </section>

  <div class="totals" id="totals"></div>
  <div class="totals" id="cluster" hidden></div>
  <div id="groups"></div>
  <footer id="footer"></footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var stored = null;
  try { stored = localStorage.getItem("nbuddyn.lang"); } catch (e) {}
  var lang = stored || (navigator.language || "en").slice(0, 2);
  if (["en", "es", "pt"].indexOf(lang) < 0) lang = "en";

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function itemLine(item, ui) {
    var line = el("div", null, [item.workflow, item.node, item.detail].filter(Boolean).join(" › "));
    if (item.active === false) line.appendChild(el("span", "tag", ui.inactive));
    return line;
  }

  function setNeedle(score, available) {
    var shown = available ? Math.max(0, Math.min(100, score)) : 0;
    var angle = Math.PI * (1 - shown / 100);
    $("needle").setAttribute("x2", (130 + 84 * Math.cos(angle)).toFixed(1));
    $("needle").setAttribute("y2", (130 - 84 * Math.sin(angle)).toFixed(1));
  }

  function render(r) {
    var ui = r.ui;
    document.documentElement.lang = r.lang;
    $("tagline").textContent = ui.tagline;
    $("export").textContent = ui.export;
    $("langs").setAttribute("aria-label", ui.language);
    Array.prototype.forEach.call($("langs").children, function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === r.lang));
    });
    $("footer").textContent = ui.read_only;

    var notice = $("notice");
    notice.replaceChildren();
    if (!r.available || r.error) {
      var box = el("div", "notice");
      box.appendChild(el("div", null, ui.unavailable));
      if (r.error) box.appendChild(el("div", "why", r.error));
      notice.appendChild(box);
    }
    if (r.cluster_error) {
      var redisBox = el("div", "notice");
      redisBox.appendChild(el("div", null, ui.cluster_unavailable));
      redisBox.appendChild(el("div", "why", r.cluster_error));
      notice.appendChild(redisBox);
    }

    var zoneClass = r.available ? r.zone : "off";
    var score = $("score");
    score.className = "score " + zoneClass;
    score.replaceChildren(document.createTextNode(r.available ? r.score : "–"), el("small", null, "/100"));
    var zone = $("zone");
    zone.className = "zone " + zoneClass;
    zone.textContent = r.available ? ui["zone_" + r.zone] : "";
    setNeedle(r.score, r.available);
    $("gauge").setAttribute("aria-label", ui.gauge + ": " + (r.available ? r.score + "/100, " + ui["zone_" + r.zone] : "–"));

    $("sweep").textContent = r.generated_at
      ? ui.sweep + " · " + new Date(r.generated_at * 1000).toLocaleString(r.lang)
      : "";
    $("headline").textContent = r.available ? r.headline : ui.unavailable;
    $("lead").textContent = r.available ? r.lead : "";

    var lights = $("lights");
    lights.replaceChildren();
    if (r.available) {
      r.lights.forEach(function (l) {
        var light = el("div", "light " + l.level);
        light.appendChild(el("div", "name", ui["light_" + l.key]));
        light.appendChild(el("div", "count", l.count === 0 ? ui.ok : l.count));
        lights.appendChild(light);
      });
    }

    var totals = $("totals");
    totals.replaceChildren();
    if (r.available) {
      [[r.totals.urgent, ui.total_urgent, "risk"], [r.totals.important, ui.total_important, "caution"],
       [r.totals.minor, ui.total_minor, ""], [r.inventory.workflows, ui.workflows_reviewed, ""],
       [r.inventory.nodes, ui.nodes_reviewed, ""]].forEach(function (t) {
        var cell = el("div");
        cell.appendChild(el("div", "n " + (t[0] > 0 ? t[2] : ""), t[0]));
        cell.appendChild(el("div", "t", t[1]));
        totals.appendChild(cell);
      });
    }

    var cluster = $("cluster");
    cluster.replaceChildren();
    cluster.hidden = !(r.available && r.cluster);
    if (r.available && r.cluster) {
      var c = r.cluster;
      var memory = c.redis_max_mb > 0 ? c.redis_used_mb + " / " + c.redis_max_mb + " MB" : c.redis_used_mb + " MB";
      [[c.waiting, ui.queue_waiting, c.waiting >= 100 ? "caution" : ""],
       [c.active, ui.queue_active, ""],
       [c.workers, ui.workers, c.main + c.workers + c.webhooks > 0 && c.workers === 0 ? "risk" : ""],
       [c.webhooks, ui.webhooks, ""],
       [memory, ui.redis_memory + (c.redis_max_mb > 0 ? "" : " · " + ui.no_limit), ""]].forEach(function (t) {
        var cell = el("div");
        cell.appendChild(el("div", "n " + t[2], t[0]));
        cell.appendChild(el("div", "t", t[1]));
        cluster.appendChild(cell);
      });
    }

    var out = $("groups");
    out.replaceChildren();
    var n = 0;
    [["high", ui.urgent], ["medium", ui.important], ["low", ui.minor], ["info", ui.info]].forEach(function (sev) {
      var groups = r.groups.filter(function (g) { return g.severity === sev[0]; });
      if (groups.length === 0) return;
      var heading = el("h2", sev[0]);
      heading.appendChild(el("i"));
      heading.appendChild(document.createTextNode(sev[1]));
      out.appendChild(heading);

      groups.forEach(function (g) {
        n += 1;
        var row = el("div", "group");
        row.appendChild(el("span", "num", n < 10 ? "0" + n : n));
        var what = el("div", "what");
        what.appendChild(el("h3", null, g.title));
        what.appendChild(el("p", null, g.advice));
        row.appendChild(what);

        var where = el("div", "where");
        var first = sev[0] === "info" ? 0 : 3;
        g.items.slice(0, first).forEach(function (item) { where.appendChild(itemLine(item, ui)); });
        var rest = g.items.slice(first);
        if (rest.length > 0) {
          var more = el("details");
          more.setAttribute("data-more", "");
          more.appendChild(el("summary", null, first > 0 ? "+ " + rest.length + " " + ui.more : ui.show + " (" + rest.length + ")"));
          rest.forEach(function (item) { more.appendChild(itemLine(item, ui)); });
          where.appendChild(more);
        }
        row.appendChild(where);
        out.appendChild(row);
      });
    });
  }

  function load() {
    fetch("api/report?lang=" + encodeURIComponent(lang), { credentials: "same-origin" })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
      .then(render)
      .catch(function (err) { console.error("nbuddyn", err); });
  }

  $("langs").addEventListener("click", function (ev) {
    var next = ev.target.getAttribute && ev.target.getAttribute("data-lang");
    if (!next) return;
    lang = next;
    try { localStorage.setItem("nbuddyn.lang", lang); } catch (e) {}
    load();
  });
  $("export").addEventListener("click", function () {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) { d.open = true; });
    window.print();
  });

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
