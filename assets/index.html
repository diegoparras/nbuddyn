<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>nbuddyn</title>
<style>
  :root {
    --bg: #0A0E13; --surface: #10161D; --raised: #161E28; --line: #1E2A38; --line2: #2E3D50;
    --ink: #E8EEF4; --soft: #BAC7D4; --muted: #8494A7;
    --red: #FF6B4A; --red-ink: #FF8E73; --red-bg: #2A1410;
    --amber: #F5B83D; --amber-bg: #2A2110;
    --green: #3DD68C; --green-bg: #10231A;
    --blue: #4A8FE8; --blue-ink: #9DB8E0; --blue-bg: #111C2C;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3, p { margin: 0; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .shell { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 10; background: rgba(10, 14, 19, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .shell { display: flex; align-items: center; gap: 0 20px; min-height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 600 18px var(--mono); letter-spacing: 0.02em; text-decoration: none; }
  nav { display: flex; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
  nav::-webkit-scrollbar { display: none; }
  nav a { display: flex; align-items: center; gap: 8px; padding: 0 12px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav a:hover { color: var(--ink); }
  nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--amber); }
  nav .badge { font: 600 11px var(--mono); padding: 1px 6px; border-radius: 10px; background: var(--raised); color: var(--soft); }
  nav .badge.high { background: var(--red-bg); color: var(--red-ink); }
  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .sweep { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; min-width: 36px; padding: 0 10px; background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--soft); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .iconbtn:hover { border-color: var(--line2); color: var(--ink); }
  .iconbtn[disabled] { opacity: 0.6; cursor: default; }
  .iconbtn svg { flex: none; }
  .spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  select.which { max-width: 190px; color: var(--ink); font-family: var(--sans); font-size: 14px; }
  .fleet { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .fleet button { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .fleet button:hover { background: var(--raised); }
  .fleet button[aria-current="true"] { border-color: var(--amber); }
  .fleet .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fleet .how { display: flex; align-items: baseline; gap: 10px; font: 13px var(--mono); color: var(--muted); margin-top: 2px; }
  .fleet .how b { font-size: 22px; font-weight: 600; }
  .inst { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .inst .who { flex: 1 1 200px; min-width: 0; }
  .inst .who small { display: block; font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 18px; }
  .addform input { flex: 1 1 180px; }
  .addform input.wide { flex: 3 1 300px; }
  select.lang { height: 36px; background: var(--bg); color: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font: 500 13px var(--mono); }

  /* Shared pieces */
  main.shell { padding-top: 28px; padding-bottom: 56px; }
  .view > header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 20px; }
  .view > header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-right: auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .card > h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); font: 600 13px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft); }
  .card > h2 a { margin-left: auto; font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--amber); text-decoration: none; }
  .card > h2 a:hover { text-decoration: underline; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 16px; border-radius: 6px; border: 1px solid var(--line2); background: none; color: var(--ink); font-weight: 500; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: #1A1305; font-weight: 600; }
  .btn.primary:hover { background: #FFC956; }
  .btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; }
  .btn[disabled] { opacity: 0.6; cursor: default; }
  .notice { border: 1px solid var(--red); background: var(--red-bg); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; overflow-wrap: anywhere; }
  .notice .why { color: var(--soft); font: 13px var(--mono); margin-top: 4px; }
  .empty { padding: 36px 18px; text-align: center; color: var(--muted); }
  .empty p { max-width: 460px; margin: 0 auto; }
  .empty .btn { margin-top: 14px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.high { background: var(--red-bg); color: var(--red-ink); }
  .pill.medium { background: var(--amber-bg); color: var(--amber); }
  .pill.low { background: var(--blue-bg); color: var(--blue-ink); }
  .pill.info { background: var(--raised); color: var(--muted); }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .tag { font: 11px var(--mono); border: 1px solid var(--line2); border-radius: 3px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
  .risk { color: var(--red-ink); } .caution { color: var(--amber); } .ok { color: var(--green); } .off { color: var(--muted); }
  input, textarea, select { font: 14px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  input::placeholder { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 10px 18px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
  td { padding: 11px 18px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  td.num { white-space: nowrap; }
  td.bad { color: var(--red-ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .tile .n { font: 500 26px var(--mono); line-height: 1.2; }
  .tile .n small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .tile .t { font-size: 13px; color: var(--muted); }
  .meter { height: 6px; border-radius: 3px; background: var(--raised); margin-top: 10px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 3px; background: var(--blue); }
  .meter i.warn { background: var(--red); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
  .stack { display: grid; gap: 16px; min-width: 0; }

  /* Overview */
  .hero { display: flex; flex-wrap: wrap; gap: 24px 44px; align-items: center; padding: 28px; margin-bottom: 16px; }
  .dial { flex: 0 1 280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .dial svg { width: 260px; max-width: 100%; height: auto; }
  .score { font: 600 60px var(--mono); line-height: 1; }
  .score small { font-size: 18px; color: var(--muted); font-weight: 500; }
  .zone { font: 500 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px; }
  .brief { flex: 1 1 400px; min-width: 0; }
  .brief h1 { margin: 8px 0 10px; font-size: 32px; line-height: 1.15; font-weight: 600; letter-spacing: -0.015em; }
  .brief .lead { color: var(--soft); max-width: 580px; margin-bottom: 20px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .lights { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .light { text-align: left; background: var(--surface); border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius); padding: 12px 14px; }
  .light:hover { background: var(--raised); }
  .light .name { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .light .count { font: 600 24px var(--mono); line-height: 1.3; }
  .light.high { border-left-color: var(--red); } .light.high .count { color: var(--red-ink); }
  .light.medium { border-left-color: var(--amber); } .light.medium .count { color: var(--amber); }
  .light.ok { border-left-color: var(--green); } .light.ok .count { color: var(--green); }
  .todo { list-style: none; margin: 0; padding: 0; }
  .todo li { display: flex; gap: 14px; padding: 16px 18px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .todo li:last-child { border-bottom: 0; }
  .todo .num { font: 500 18px var(--mono); color: var(--muted); flex: 0 0 26px; }
  .todo .body { flex: 1 1 auto; min-width: 0; }
  .todo h3 { font-size: 16px; font-weight: 600; margin: 6px 0 2px; }
  .todo p { color: var(--soft); font-size: 14px; }
  .todo .where { font: 13px var(--mono); color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 16px 18px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); text-align: right; overflow-wrap: anywhere; }
  .spark { display: block; width: 100%; height: 44px; margin-top: 12px; }
  .week { padding: 16px 18px; }
  .week + .kv { padding-top: 0; }
  .week .big { font: 500 26px var(--mono); line-height: 1.2; }
  .week .big small { font: 14px var(--sans); color: var(--muted); }
  .inv { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 28px; padding: 14px 18px; font-size: 14px; color: var(--muted); margin-top: 16px; }
  .inv b { font: 500 15px var(--mono); color: var(--ink); margin-right: 6px; }

  /* Findings */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid var(--line); background: none; color: var(--soft); font-size: 13px; font-weight: 500; white-space: nowrap; }
  .chip:hover { border-color: var(--line2); }
  .chip b { font: 600 12px var(--mono); color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .chip[aria-pressed="true"] b { color: var(--bg); }
  .chip.active-filter { border-color: var(--amber); color: var(--amber); }
  .searchbox { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 18px; color: var(--muted); }
  .searchbox:focus-within { border-color: var(--amber); }
  .searchbox input { flex: 1; border: 0; background: none; padding: 0; outline: none; }
  .gcard { margin-bottom: 10px; border-left-width: 3px; overflow: hidden; }
  .gcard.high { border-left-color: var(--red); } .gcard.medium { border-left-color: var(--amber); }
  .gcard.low { border-left-color: var(--blue); } .gcard.info { border-left-color: var(--line2); }
  .ghead { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 18px; background: none; border: 0; text-align: left; }
  .ghead:hover { background: var(--raised); }
  .ghead h3 { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 600; }
  .ghead .chev { flex: none; display: flex; color: var(--muted); transition: transform 0.15s; }
  .ghead[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .gbody { border-top: 1px solid var(--line); }
  .advice { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 12px 18px; background: var(--bg); color: var(--soft); font-size: 14px; border-bottom: 1px solid var(--line); }
  .advice b { flex: none; font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
  .advice span { flex: 1 1 260px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .items li { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .items li:last-child { border-bottom: 0; }
  .items .what { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
  .items .what .node { color: var(--soft); }
  .items .what .tag { margin-left: 8px; }
  .items .detail { flex: 1 1 200px; min-width: 0; font: 13px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .items .act { flex: none; margin-left: auto; }
  .items .note { flex: 1 1 100%; color: var(--soft); font-size: 14px; }
  .items .note small { color: var(--muted); font-family: var(--mono); margin-left: 8px; }
  .acceptform { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 2px; }
  .acceptform input { flex: 1 1 220px; }
  .morebar { padding: 8px 18px; border-top: 1px solid var(--line); }
  .linkbtn { background: none; border: 0; padding: 4px 0; color: var(--amber); font-size: 13px; font-weight: 500; }
  .linkbtn:hover { text-decoration: underline; }
  .hint { font-size: 13px; color: var(--muted); margin: 14px 2px 0; }

  /* Activity */
  .day { font: 500 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 22px 2px 8px; }
  .events { list-style: none; margin: 0; padding: 0; }
  .events li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 11px 18px; border-bottom: 1px solid var(--line); }
  .events li:last-child { border-bottom: 0; }
  .events time { flex: 0 0 48px; font: 13px var(--mono); color: var(--muted); }
  .events .kind { flex: 0 0 auto; }
  .events .what { flex: 1 1 280px; min-width: 0; overflow-wrap: anywhere; }
  .events .what .node, .events .what small { color: var(--muted); font-size: 13px; }
  .events .who { flex: 0 1 auto; font-size: 13px; color: var(--soft); }
  .changes { display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 18px; gap: 10px; }
  .changes b { display: block; font: 500 24px var(--mono); line-height: 1.2; }
  .changes span { font-size: 13px; color: var(--muted); }

  /* History */
  .ranges { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  .ranges button { background: none; border: 0; color: var(--muted); padding: 0 12px; min-height: 30px; font: 500 13px var(--mono); border-radius: 4px; }
  .ranges button[aria-pressed="true"] { background: var(--raised); color: var(--ink); }
  figure { margin: 0; position: relative; padding: 16px 18px 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--soft); margin-left: auto; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .chart { display: block; width: 100%; }
  .chart text { font: 11px var(--mono); fill: var(--muted); }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .end { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .tip { position: absolute; z-index: 2; pointer-events: none; background: var(--raised); border: 1px solid var(--line2); border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: nowrap; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5); }
  .tip .when { color: var(--muted); font: 12px var(--mono); margin-bottom: 2px; }
  .tip b { font-weight: 600; margin-right: 6px; }
  .tip .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .tip span { color: var(--soft); }
  .view.loading .card { opacity: 0.55; }
  details.daytable { border-top: 1px solid var(--line); }
  details.daytable > summary { cursor: pointer; padding: 12px 18px; color: var(--amber); font-size: 13px; font-weight: 500; }

  /* Settings */
  .settings { max-width: 760px; }
  .field { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .field input, .field textarea, .field select { width: 100%; }
  .field textarea { font: 13px var(--mono); resize: vertical; }
  .field .help { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .field .bad { font-size: 13px; color: var(--red-ink); margin-top: 6px; }
  .field.wrong input, .field.wrong textarea, .field.wrong select { border-color: var(--red); }
  .savebar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; padding: 12px 0; background: linear-gradient(transparent, var(--bg) 30%); }
  .savebar .status { margin-right: auto; font-size: 13px; color: var(--red-ink); }

  /* Loading: the shape of what is coming, not a sentence about it. */
  .sk { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--raised) 25%, #202B38 37%, var(--raised) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }
  .skcard { padding: 18px; display: grid; gap: 12px; }
  .view { animation: arrive 0.18s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .preflight { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 32px; padding: 32px 28px; }
  .preflight h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }
  .preflight p { color: var(--soft); max-width: 520px; }
  .radar { flex: none; width: 96px; height: 96px; }
  .radar .sweep { transform-origin: 48px 48px; animation: spin 2.4s linear infinite; }
  .me { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft); white-space: nowrap; }
  .me b { font-weight: 600; color: var(--ink); max-width: 120px; overflow: hidden; text-overflow: ellipsis; }

  /* Login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login form { width: min(380px, 100%); display: grid; gap: 14px; padding: 32px 28px; }
  .login .brand { justify-content: center; font-size: 22px; }
  .login .eyebrow { text-align: center; margin-bottom: 8px; }
  .login label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  .login input { padding: 10px 12px; font-size: 15px; }
  .login .btn { min-height: 44px; margin-top: 6px; }
  .login .problem { min-height: 20px; font-size: 14px; color: var(--red-ink); text-align: center; }
  .login select { justify-self: center; }
  .shake { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-weight: 500; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  footer { margin-top: 28px; font: 12px var(--mono); color: var(--muted); letter-spacing: 0.04em; }
  .printhead { display: none; }

        chart.appendChild(svg("path", { d: columnPath(x, base, w, height, k === parts.length - 1), fill: SERIES[p[0]], "pointer-events": "none" }));
      });
    });
    chart.setAttribute("aria-label", ui.runs_title + ": " + num(hist.totals.ok) + " " + ui.runs_ok + ", " + num(hist.totals.failed) + " " + ui.runs_failed);
  }
  function drawScore(chart, hist, ui) {
    var g = frame(chart, hist.days, 100, [0, 50, 100], 150, function (d) {
      return [[SERIES.ok, d.score === undefined ? "–" : d.score, ui.col_score.toLowerCase()]];
    });
    var path = "", pen = false, last = null;
    hist.days.forEach(function (d, i) {
      if (d.score === undefined) { pen = false; return; }
      var x = g.x(i) + g.band / 2, y = g.y(d.score);
      path += (pen ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
      pen = true;
      last = { x: x, y: y, score: d.score };
    });
    if (path) chart.appendChild(svg("path", { d: path, fill: "none", stroke: SERIES.ok, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "pointer-events": "none" }));
    if (last) {
      chart.appendChild(svg("circle", { cx: last.x, cy: last.y, r: 4, fill: SERIES.ok, stroke: "var(--surface)", "stroke-width": 2, "pointer-events": "none" }));
      chart.appendChild(svg("text", { "class": "end", x: last.x + 9, y: last.y + 4 }, last.score));
    }
    chart.setAttribute("aria-label", ui.score_title + (last ? ": " + last.score + "/100" : ""));
  }

  function renderHistory() {
    var r = state.report, ui = r.ui, hist = state.history, view = $("view-history");
    var title = h("h1", null, ui.history);
    if (!hist) return fill(view, h("header", null, title), skeleton(3), h("div", { style: "height:16px" }), skeleton(6));
    if (!hist.enabled) return fill(view, h("header", null, title), h("div", "card empty", h("p", null, ui.history_off)));
    view.classList.remove("loading");
    var ranges = h("div", { class: "ranges", role: "group", "aria-label": ui.history });
    RANGES.forEach(function (n) {
      ranges.appendChild(h("button", { type: "button", "aria-pressed": String(n === state.range), text: n + " " + ui.days, on: { click: function () {
        if (n === state.range) return;
        state.range = n;
        store("nbuddyn.range", String(n));
        view.classList.add("loading");
        loadHistory();
      } } }));
    });

    var total = runsOf(hist.totals);
    var tiles = h("div", "tiles",
      tile(compact(total), ui.runs_total),
      tile(compact(hist.totals.ok || 0), ui.runs_ok),
      tile(compact(hist.totals.failed || 0), ui.runs_failed, hist.totals.failed ? "risk" : ""),
      tile(percent(hist.totals.failed || 0, total), ui.failure_rate));

    var legend = h("span", "legend");
    [["ok", ui.runs_ok], ["failed", ui.runs_failed]].concat(hist.totals.canceled ? [["canceled", ui.runs_canceled]] : []).forEach(function (s) {
      legend.appendChild(h("span", null, h("i", { style: "background:" + SERIES[s[0]] }), s[1]));
    });
    var runsChart = svg("svg", { "class": "chart", role: "img" }), scoreChart = svg("svg", { "class": "chart", role: "img" });
    var charts = h("div", "stack",
      h("div", "card", h("h2", null, ui.runs_title, legend), h("figure", null, runsChart),
        h("details", "daytable", h("summary", null, ui.table_by_day),
          tableOf([[ui.col_day], [ui.runs_ok, "num"], [ui.runs_failed, "num"], [ui.col_score, "num"]],
            hist.days.slice().reverse().map(function (d) { return [[dayLabel(d.day, true)], [num(d.ok)], [num(d.failed), d.failed ? "bad" : ""], [d.score === undefined ? "–" : d.score]]; })))),
      h("div", "card", h("h2", null, ui.score_title), h("figure", null, scoreChart)));

    var workflows = h("div", "card", h("h2", null, ui.inv_workflows));
    if (!hist.workflows.length) workflows.appendChild(h("div", "empty", h("p", null, ui.history_empty)));
    else {
      var t = tableOf([[ui.col_workflow], [ui.col_runs, "num"], [ui.col_failed, "num"], [ui.col_rate, "num"], [ui.col_last, "num optional"]],
        hist.workflows.map(function (w) {
          var runs = runsOf(w);
          return [[whereOf({ workflow: w.name, path: w.path }, ui)], [num(runs)], [num(w.failed), w.failed ? "bad" : ""], [percent(w.failed || 0, runs)], [dayLabel(w.last_day)]];
        }));
      workflows.appendChild(t);
      var rows = t.querySelectorAll("tbody tr");
      if (rows.length > 12 && !state.printing) {
        for (var i = 12; i < rows.length; i++) rows[i].hidden = true;
        var more = h("div", "morebar", h("button", { type: "button", class: "linkbtn", text: ui.show_all + " (" + rows.length + ")", on: { click: function () {
          Array.prototype.forEach.call(rows, function (row) { row.hidden = false; });
          more.remove();
        } } }));
        workflows.appendChild(more);
      }
    }
    fill(view, h("header", null, title, ranges), tiles, charts, h("div", { style: "height:16px" }), workflows,
      h("p", "hint", (hist.since ? ui.history_since + " " + dayLabel(hist.since, true) + ". " : "") + ui.history_note));
    if (hist.days.length && !view.hidden) { drawRuns(runsChart, hist, ui); drawScore(scoreChart, hist, ui); }
  }

  /* ---------- Settings ---------- */
  var SECTIONS = [["sec_instance", [["name", "text"], ["database_url", "text"], ["n8n_url", "text"], ["timezone", "text"]]],
                  ["sec_cluster", [["redis_url", "text"], ["runner_urls", "area"]]],
                  ["sec_general", [["lang", "select"], ["interval_seconds", "number"], ["history_days", "number"]]]];

  /* Who can come in, and with what role. */
  function usersCard(ui) {
    var card = h("div", "card", h("h2", null, ui.users)), body = h("div", null, h("div", "skcard", h("span", { class: "sk", style: "height:16px" }), h("span", { class: "sk", style: "width:70%;height:16px" })));
    card.appendChild(body);
    var draw = function () {
      get("api/users").then(function (users) {
        body.replaceChildren();
        users.forEach(function (u) {
          var row = h("div", "inst", h("div", "who", u.name, h("small", null, ui["role_" + u.role] + (u.fixed ? " · " + ui.users_env_note : ""))));
          if (!u.fixed) row.appendChild(h("button", { type: "button", class: "btn small", text: ui.remove_instance, on: { click: function () {
            if (!window.confirm(ui.user_remove_confirm + "\n\n" + u.name)) return;
            send("api/users/remove", { user: u.name }).then(function (answer) { toast(answer.ok ? ui.user_removed : ui.save_failed); draw(); });
          } } }));
          body.appendChild(row);
        });
        if (!state.me || !state.me.can_store_users) return body.appendChild(h("p", { class: "hint", style: "margin:0;padding:14px 18px", text: ui.users_need_store }));
        var name = h("input", { type: "text", placeholder: ui.set_user, "aria-label": ui.set_user, autocomplete: "off", spellcheck: false, maxLength: 40 });
        var password = h("input", { type: "password", placeholder: ui.set_password, "aria-label": ui.set_password, autocomplete: "new-password" });
        var role = h("select", { "aria-label": ui.users });
        [["viewer", ui.role_viewer], ["admin", ui.role_admin]].forEach(function (o) { role.appendChild(h("option", { value: o[0], text: o[1] })); });
        var add = h("button", { type: "submit", class: "btn", text: ui.add });
        var form = h("form", "addform", name, password, role, add);
        [name, password].forEach(function (input) { input.addEventListener("input", function () { state.busy = true; }); });
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          add.disabled = true;
          send("api/users", { user: name.value, password: password.value, role: role.value }).then(function (answer) {
            add.disabled = false;
            if (!answer.ok) {
              var wrong = (answer.wrong || [])[0];
              (wrong === "password" ? password : name).focus();
              return toast(wrong ? ui.invalid + ": " + (ui["set_" + wrong] || wrong) : ui.save_failed);
            }
            state.busy = false;
            toast(ui.user_added);
            draw();
          });
        });
        body.appendChild(form);
        body.appendChild(h("p", { class: "hint", style: "margin:0;padding:0 18px 16px", text: ui.help_users }));
      }).catch(function () {});
    };
    draw();
    return card;
  }
  /* Who did what inside nbuddyn. */
  function auditCard(ui) {
    var card = h("div", "card", h("h2", null, ui.audit)), body = h("div", "skcard", h("span", { class: "sk", style: "height:16px" }), h("span", { class: "sk", style: "width:80%;height:16px" }));
    card.appendChild(body);
    get("api/audit").then(function (entries) {
      if (!entries.length) return body.replaceWith(h("div", "empty", h("p", null, ui.audit_empty)));
      var list = h("ul", "events");
      entries.slice(0, 40).forEach(function (e) {
        var when = new Date(e.at * 1000);
        list.appendChild(h("li", null,
          h("time", { dateTime: when.toISOString(), style: "flex-basis:120px", text: when.toLocaleString(state.lang, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }),
          h("div", "what", h("b", null, e.user || "–"), " " + (ui["act_" + e.action] || e.action))));
      });
      body.replaceWith(list);
    }).catch(function () {});
    return card;
  }

  /* The list of instances, with a form to add one and a button to remove each. */
  function instancesCard(s, ui) {
    var r = state.report, card = h("div", "card", h("h2", null, ui.instances));
    r.instances.forEach(function (i) {
      var row = h("div", "inst",
        h("div", "who", i.name, h("small", null, i.available ? i.score + "/100" : ui.first_scan)),
        i.id === r.instance.id ? h("span", "pill ok", ui.watching) : h("button", { type: "button", class: "btn small", text: ui.see, on: { click: function () { switchTo(i.id); } } }));
      if (s.writable && i.id !== "main") row.appendChild(h("button", { type: "button", class: "btn small", text: ui.remove_instance, on: { click: function () {
        if (!window.confirm(ui.remove_confirm + "\n\n" + i.name)) return;
        send("api/instances/remove?instance=" + encodeURIComponent(i.id)).then(function (answer) {
          if (!answer.ok) return toast(ui.save_failed);
          toast(ui.instance_removed);
          if (i.id === state.instance) state.instance = "";
          setTimeout(function () { switchTo(state.instance); }, 800);
        });
      } } }));
      card.appendChild(row);
    });
    if (s.writable) {
      var name = h("input", { type: "text", placeholder: ui.set_name, "aria-label": ui.set_name, maxLength: 60 });
      var url = h("input", { type: "text", class: "wide", placeholder: "postgres://user:password@host:5432/n8n", "aria-label": ui.set_database_url, spellcheck: false, autocomplete: "off" });
      var add = h("button", { type: "submit", class: "btn", text: ui.add });
      var form = h("form", "addform", name, url, add);
      [name, url].forEach(function (input) { input.addEventListener("input", function () { state.busy = true; }); });
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        add.disabled = true;
        send("api/instances", { name: name.value, database_url: url.value }).then(function (answer) {
          add.disabled = false;
          if (!answer.ok) {
            var wrong = answer.wrong || [];
            (wrong.indexOf("name") >= 0 ? name : url).focus();
            return toast(wrong.length ? ui.invalid + ": " + wrong.map(function (w) { return ui["set_" + w] || w; }).join(", ") : ui.save_failed);
          }
          state.busy = false;
          toast(ui.instance_added);
          setTimeout(function () { load().then(function () { if (state.view === "settings") renderSettings(); }); }, 1500);
        });
      });
      card.appendChild(h("div", { class: "field", style: "border-bottom:0;padding-bottom:0" }, h("label", null, ui.add_instance)));
      card.appendChild(form);
      card.appendChild(h("p", { class: "hint", style: "margin:0;padding:0 18px 16px", text: ui.help_database_url }));
    }
    return card;
  }

  function renderSettings() {
    var ui = state.report.ui, view = $("view-settings");
    if (!view.querySelector("form")) fill(view, h("header", null, h("h1", null, ui.settings)), h("div", "settings stack", skeleton(3), skeleton(5)));
    return get(at("api/settings")).then(function (s) {
      var status = h("span", { class: "status", role: "status" });
      var save = h("button", { type: "submit", class: "btn primary", text: ui.save, hidden: !s.writable });
      var form = h("form", { class: "settings stack", novalidate: true });
      if (!s.writable) form.appendChild(h("div", "notice", h("div", null, ui.settings_readonly), s.error ? h("div", "why", s.error) : null));
      form.appendChild(instancesCard(s, ui));
      SECTIONS.forEach(function (section) {
        var title = section[0] === "sec_instance" ? s.instance.name : ui[section[0]];
        var card = h("div", "card", h("h2", null, title));
        section[1].forEach(function (f) {
          var name = f[0], input;
          if (name === "database_url" && s.primary) {
            card.appendChild(h("div", "field", h("label", null, ui.set_database_url), h("div", "mono", s.database), h("div", "help", ui.primary_note + ".")));
            return;
          }
          if (f[1] === "select") {
            input = h("select");
            [["en", "English"], ["es", "Español"], ["pt", "Português"]].forEach(function (o) { input.appendChild(h("option", { value: o[0], text: o[1] })); });
          } else if (f[1] === "area") input = h("textarea", { rows: 5, spellcheck: false });
          else input = h("input", { type: f[1], spellcheck: false, autocomplete: "off" });
          input.id = "set_" + name;
          input.name = name;
          input.value = s.values[name];
          input.disabled = !s.writable;
          input.addEventListener("input", function () { state.busy = true; });
          card.appendChild(h("div", { class: "field", "data-field": name },
            h("label", { htmlFor: "set_" + name, text: ui["set_" + name] }), input,
            ui["help_" + name] ? h("div", "help", ui["help_" + name]) : null));
        });
        form.appendChild(card);
      });
      var about = h("dl", "kv");
      [[ui.env_mcp, s.mcp ? ui.on : ui.off], ["nbuddyn", s.version]].forEach(function (row) {
        about.appendChild(h("dt", null, row[0]));
        about.appendChild(h("dd", null, row[1]));
      });
      if (state.me && !state.me.open) { form.appendChild(usersCard(ui)); form.appendChild(auditCard(ui)); }
      form.appendChild(h("div", "card", h("h2", null, ui.sec_about), about, h("p", { class: "hint", style: "margin:0;padding:0 18px 16px", text: ui.env_only + ". " + ui.read_only })));
      form.appendChild(h("div", "savebar", status, save));
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var values = {};
        SECTIONS.forEach(function (section) { section[1].forEach(function (f) { var field = $("set_" + f[0]); if (field) values[f[0]] = field.value; }); });
        save.disabled = true;
        status.textContent = "";
        Array.prototype.forEach.call(form.querySelectorAll(".field"), function (w) {
          w.classList.remove("wrong");
          var old = w.querySelector(".bad");
          if (old) old.remove();
        });
        send(at("api/settings"), values).then(function (answer) {
          save.disabled = false;
          if (answer.ok) {
            state.busy = false;
            state.lang = values.lang;
            store("nbuddyn.lang", state.lang);
            toast(ui.saved);
            return setTimeout(function () { load().then(function () { if (state.view === "settings") renderSettings(); }); }, 1200);
          }
          (answer.wrong || []).forEach(function (name) {
            var w = form.querySelector('[data-field="' + name + '"]');
            if (!w) return;
            w.classList.add("wrong");
            w.insertBefore(h("div", "bad", ui.invalid), w.querySelector(".help"));
          });
          var first = form.querySelector(".wrong input, .wrong textarea, .wrong select");
          if (first) first.focus();
          else status.textContent = ui.save_failed + (answer.error ? ": " + answer.error : "");
        });
      });
      fill(view, h("header", null, h("h1", null, ui.settings)), form);
    }).catch(function (err) { console.error("nbuddyn", err); });
  }

  /* ---------- Wiring ---------- */
  function renderAll() {
    if (!state.report) return;
    renderChrome();
    renderOverview();
    renderFindings();
    renderCluster();
    renderActivity();
    renderHistory();
  }
  function show() {
    var view = (location.hash.match(/^#\/([a-z]+)/) || [])[1];
    view = VIEWS.indexOf(view) >= 0 ? view : "overview";
    var changed = view !== state.view;
    state.view = view;
    VIEWS.forEach(function (v) { $("view-" + v).hidden = v !== state.view; });
    state.busy = false;
    if (!state.report) return;
    renderChrome();
    if (state.view === "history") renderHistory();
    if (state.view === "settings" && state.me && state.me.role !== "admin") return void (location.hash = "#/overview");
    if (state.view === "settings") renderSettings();
    if (changed) window.scrollTo(0, 0);
  }
  function loadActivity() {
    return get(at("api/activity?days=30&lang=" + encodeURIComponent(state.lang))).then(function (a) {
      state.activity = a;
      if (state.report) renderActivity();
    }).catch(function (err) { console.error("nbuddyn", err); });
  }
  function loadHistory() {
    return get(at("api/history?days=" + state.range)).then(function (hist) {
      state.history = hist;
      if (state.report) { renderChrome(); renderHistory(); }
    }).catch(function (err) { console.error("nbuddyn", err); });
  }
  function load() {
    var week = get(at("api/history?days=7")).then(function (w) { state.week = w; }).catch(function () {});
    var report = get(at("api/report?lang=" + encodeURIComponent(state.lang))).then(function (r) {
      state.report = r;
      state.instance = r.instance.id;
    });
    return Promise.all([report, week]).then(function () {
      renderAll();
      loadActivity();
      return loadHistory();
    }).catch(function (err) { console.error("nbuddyn", err); });
  }

  $("which").addEventListener("change", function () { switchTo($("which").value); });
  $("lang").addEventListener("change", function () {
    state.lang = $("lang").value;
    store("nbuddyn.lang", state.lang);
    load().then(function () { if (state.view === "settings") renderSettings(); });
  });
  $("rescan").addEventListener("click", function () {
    if (state.scanning || !state.report) return;
    var before = state.report.generated_at, tries = 0;
    state.scanning = true;
    renderChrome();
    var poll = function () {
      tries += 1;
      setTimeout(function () {
        get(at("api/report?lang=" + encodeURIComponent(state.lang))).then(function (r) {
          if (r.generated_at !== before || tries >= 20) {
            state.scanning = false;
            return load();
          }
          poll();
        }).catch(function () { state.scanning = false; renderChrome(); });
      }, 1500);
    };
    send("api/rescan").then(poll);
  });
  $("export").addEventListener("click", function () {
    if (!state.report) return;
    state.printing = true;
    VIEWS.forEach(function (v) { $("view-" + v).hidden = v === "settings"; });
    renderAll();
    window.print();
  });
  window.addEventListener("afterprint", function () {
    state.printing = false;
    VIEWS.forEach(function (v) { $("view-" + v).hidden = v !== state.view; });
    renderAll();
  });
  window.addEventListener("hashchange", show);
  var resizing = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizing);
    resizing = setTimeout(function () { if (state.report && state.view === "history") renderHistory(); }, 150);
  });

  function start() {
    return get("api/me").then(function (me) {
      state.me = me;
      $("app").hidden = false;
      show();
      return load().then(show);
    }).catch(function (status) { if (status !== 401) console.error("nbuddyn", status); });
  }
  start();
  /* An open form is left alone: a refresh would wipe what is being typed. */
  setInterval(function () { if (state.me && !state.busy && !state.scanning && !state.printing) load(); }, 60000);
})();
